<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
*{
  box-sizing:border-box;
}

body{
  width:300px;
  margin:0;
  padding:12px;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  font-family:"Microsoft YaHei","微软雅黑",sans-serif;
  color:#e2e8f0;
}

.card{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;
  padding:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
  display:flex;
  flex-direction:column;
  gap:8px;
}

.title{
  font-size:16px;
  font-weight:600;
  letter-spacing:.5px;
  text-align:center;
  margin-bottom:4px;
  color:#f1f5f9;
}

.subtitle{
  font-size:12px;
  text-align:center;
  opacity:.6;
  margin-bottom:8px;
}

button{
  width:100%;
  height:36px;
  font-size:14px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  color:white;
  transition:.25s ease;
  position:relative;
  overflow:hidden;
}

button::after{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(
      120deg,
      transparent,
      rgba(255,255,255,.2),
      transparent
  );
  transition:.6s;
}

button:hover::after{
  left:100%;
}

button:hover{
  transform:translateY(-2px);
}

button:active{
  transform:translateY(1px);
}

/* 连接 */
#btn{
  background:linear-gradient(135deg,#3b82f6,#2563eb);
}

/* 自动活跃 */
#btn2{
  background:linear-gradient(135deg,#22c55e,#16a34a);
}

/* Reels */
#btn3{
  background:linear-gradient(135deg,#f59e0b,#d97706);
}

/* 小组 */
#btn4{
  background:linear-gradient(135deg,#8b5cf6,#7c3aed);
}

/* 分隔线 */
.divider{
  height:1px;
  background:rgba(255,255,255,.12);
  margin:2px 0;
}

/* 取消好友请求 */
#btn5{
  background:linear-gradient(135deg,#14b8a6,#0f766e);
}
#btn6{
  background:#475569;
}

.footer{
  margin-top:6px;
  font-size:11px;
  text-align:center;
  opacity:.4;
}
#connection-status { font-size:12px; }
</style>
</head>

<body>

<div class="card">

  <div class="title">控制面板</div>
  <div class="subtitle">执行自动操作</div>

  <button id="btn">连接</button>
  <span id="connection-status" role="status"></span>

  <button id="btn2">自动活跃</button>

  <button id="btn3">活跃 Reels</button>

  <button id="btn4">活跃小组</button>
  <button id="btn6">自定义活跃</button>

  <div class="divider"></div>

  <button id="btn5">取消好友请求</button>

  <div class="footer">v0.8.1</div>

</div>

<script src="popup.js"></script>

</body>
</html>
