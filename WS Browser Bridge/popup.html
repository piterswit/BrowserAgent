<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  *{
    box-sizing:border-box;
  }

  body{
    width:260px;
    margin:0;
    padding:16px;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    font-family:"Microsoft YaHei","微软雅黑",sans-serif;
    color:#e2e8f0;
  }

  .card{
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:18px;
    padding:18px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .title{
    font-size:16px;
    font-weight:600;
    letter-spacing:.5px;
    text-align:center;
    margin-bottom:4px;
    color:#f1f5f9;
  }

  .subtitle{
    font-size:12px;
    text-align:center;
    opacity:.6;
    margin-bottom:8px;
  }

  button{
    width:100%;
    height:42px;
    font-size:14px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    color:white;
    transition:.25s ease;
    position:relative;
    overflow:hidden;
  }

  button::after{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,.2),transparent);
    transition:.6s;
  }

  button:hover::after{
    left:100%;
  }

  button:hover{
    transform:translateY(-2px);
  }

  button:active{
    transform:translateY(1px);
  }

  /* 主按钮 */
  #btn{
    background:linear-gradient(135deg,#3b82f6,#2563eb);
  }

  /* 次按钮 */
  #btn2{
    background:linear-gradient(135deg,#22c55e,#16a34a);
  }

  /* 功能按钮 */
  #btn3{
    background:linear-gradient(135deg,#f59e0b,#d97706);
  }

  #btn4{
    background:linear-gradient(135deg,#8b5cf6,#7c3aed);
  }

  .footer{
    margin-top:8px;
    font-size:11px;
    text-align:center;
    opacity:.4;
  }

</style>
</head>
<body>

  <div class="card">
    <div class="title">控制面板</div>
    <div class="subtitle">执行自动操作</div>

    <button id="btn">连接</button>
    <button id="btn2">自动活跃</button>
    <button id="btn3">活跃 Reels</button>
    <button id="btn4">活跃小组</button>

    <div class="footer">v1.1</div>
  </div>

<script src="popup.js"></script>
</body>
</html>
