name: Cross-platform compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python_arch: x64
            package_arch: auto
          - os: ubuntu-22.04
            python_arch: x64
            package_arch: auto
          - os: macos-15
            python_arch: arm64
            package_arch: arm64
          - os: macos-15-intel
            python_arch: x64
            package_arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.10"
          architecture: ${{ matrix.python_arch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb fonts-noto-cjk
      - name: Locked Python dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements.lock"
      - name: Python tests
        run: python -B -m unittest discover -s tests -p 'test_*.py'
      - name: Plugin tests
        shell: pwsh
        run: |
          $testFiles = @(Get-ChildItem -LiteralPath tests -Filter '*.test.cjs' | ForEach-Object { $_.FullName })
          node --test --test-timeout=15000 @testFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Linux UI smoke check
        if: runner.os == 'Linux'
        run: xvfb-run -a python -B tools/check_posix_ui.py
      - name: macOS UI smoke check
        if: runner.os == 'macOS'
        run: python -B tools/check_posix_ui.py
      - name: Browser flow checks
        shell: pwsh
        run: |
          foreach ($script in @('identity', 'multilingual', 'post', 'background', 'cover', 'cancel_requests', 'task_page')) {
            node "tools/check_${script}_browser.cjs"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build native POSIX package
        if: runner.os != 'Windows'
        run: python tools/build_posix_release.py --arch ${{ matrix.package_arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: runner.os != 'Windows'
        with:
          name: BrowserAgent-${{ runner.os }}-${{ matrix.python_arch }}
          path: |
            release/*.tar.gz
            release/*.dmg
            release/SHA256SUMS_*.txt
          if-no-files-found: error
