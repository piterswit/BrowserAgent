name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Check Version and Run Tests
        shell: powershell
        run: |
          python tools/check_release.py --tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testFiles = @(Get-ChildItem -LiteralPath tests -Filter '*.test.cjs' | ForEach-Object { $_.FullName })
          node --test --test-timeout=15000 @testFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check Browser Flows
        timeout-minutes: 5
        shell: powershell
        run: |
          node tools/check_multilingual_browser.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/check_post_browser.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/check_background_browser.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/check_cover_browser.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/check_cancel_requests_browser.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and Verify Windows Packages
        shell: powershell
        run: |
          python tools/build_windows_release.py --tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate Build Attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "release/FB_Auto_Active_${{ github.ref_name }}.zip"

      - name: Upload Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/FB_Auto_Active_${{ github.ref_name }}.zip
            release/FB_Browser_Bridge_${{ github.ref_name }}.zip
            release/SHA256SUMS_${{ github.ref_name }}.txt
