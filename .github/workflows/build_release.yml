name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Check Version and Run Tests
        shell: powershell
        run: |
          python tools/check_release.py --tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/activity.test.cjs tests/activity_interactions.test.cjs tests/avatar_bridge.test.cjs tests/avatar_page.test.cjs tests/cancel_requests.test.cjs tests/bridge_security.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build EXE
        shell: powershell
        run: |
          $iconFolder = Join-Path $env:GITHUB_WORKSPACE "WS Browser Bridge/icon"
          python -m PyInstaller server.py `
            --onefile `
            --noconsole `
            --clean `
            --noconfirm `
            --specpath build `
            --icon "$iconFolder/bridge.ico" `
            --add-data "$iconFolder;WS Browser Bridge/icon" `
            --name "FB_server"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create Release Folder
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $releaseFolder = Join-Path "release" "FB_Auto_Active_$env:RELEASE_TAG"
          New-Item -ItemType Directory -Path $releaseFolder -Force
          Copy-Item -LiteralPath ".\dist\FB_server.exe" -Destination $releaseFolder
          Copy-Item -LiteralPath ".\README.md" -Destination $releaseFolder
          Copy-Item -LiteralPath ".\WS Browser Bridge" -Destination "$releaseFolder\Browser_Extension" -Recurse

      - name: Zip Release
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $zipFile = "release/FB_Auto_Active_$env:RELEASE_TAG.zip"
          Compress-Archive `
            -Path "release/FB_Auto_Active_$env:RELEASE_TAG" `
            -DestinationPath $zipFile -Force
          python tools/check_release.py --tag "$env:RELEASE_TAG" --exe "dist/FB_server.exe" --zip "$zipFile"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate Build Attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "release/FB_Auto_Active_${{ github.ref_name }}.zip"

      - name: Upload Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            release/FB_Auto_Active_${{ github.ref_name }}.zip
