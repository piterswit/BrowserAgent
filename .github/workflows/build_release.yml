name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Version and Run Tests
        shell: powershell
        run: |
          python tools/check_release.py --tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/activity.test.cjs tests/activity_interactions.test.cjs tests/avatar_bridge.test.cjs tests/avatar_page.test.cjs tests/cancel_requests.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build EXE
        shell: powershell
        run: |
          $iconFolder = Join-Path $env:GITHUB_WORKSPACE "WS Browser Bridge/icon"
          python -m PyInstaller server.py `
            --onefile `
            --noconsole `
            --clean `
            --noconfirm `
            --specpath build `
            --icon "$iconFolder/bridge.ico" `
            --add-data "$iconFolder;WS Browser Bridge/icon" `
            --name "FB_server"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create Release Folder
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $releaseFolder = Join-Path "release" "FB_Auto_Active_$env:RELEASE_TAG"
          New-Item -ItemType Directory -Path $releaseFolder -Force
          Copy-Item -LiteralPath ".\dist\FB_server.exe" -Destination $releaseFolder
          Copy-Item -LiteralPath ".\README.md" -Destination $releaseFolder
          Copy-Item -LiteralPath ".\WS Browser Bridge" -Destination "$releaseFolder\Browser_Extension" -Recurse

      - name: Zip Release
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $zipFile = "release/FB_Auto_Active_$env:RELEASE_TAG.zip"
          Compress-Archive `
            -Path "release/FB_Auto_Active_$env:RELEASE_TAG" `
            -DestinationPath $zipFile -Force
          python tools/check_release.py --tag "$env:RELEASE_TAG" --exe "dist/FB_server.exe" --zip "$zipFile"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate Build Attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "release/FB_Auto_Active_${{ github.ref_name }}.zip"

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            release/FB_Auto_Active_${{ github.ref_name }}.zip
