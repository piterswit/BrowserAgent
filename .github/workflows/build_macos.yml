name: Build macOS arm64 and x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            python_arch: arm64
          - runner: macos-15-intel
            arch: x64
            python_arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements.lock"
      - name: Run Python and plugin regression tests
        shell: pwsh
        run: |
          python -B -m unittest discover -s tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testFiles = @(Get-ChildItem -LiteralPath tests -Filter '*.test.cjs' | ForEach-Object { $_.FullName })
          node --test --test-timeout=15000 @testFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check native desktop windows and themes
        run: python -B tools/check_posix_ui.py
      - name: Check identity and posting browser flows
        run: |
          node tools/check_identity_browser.cjs
          node tools/check_post_browser.cjs
      - name: Build, check architectures, signatures and native startup
        run: python tools/build_posix_release.py --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BrowserAgent-macOS-${{ matrix.arch }}
          path: |
            release/*macOS_${{ matrix.arch }}.dmg
            release/*macOS_${{ matrix.arch }}.tar.gz
            release/SHA256SUMS_*macOS_${{ matrix.arch }}.txt
          if-no-files-found: error
